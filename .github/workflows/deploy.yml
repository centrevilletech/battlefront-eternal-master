name: Build, test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm test
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, aldine, deploy, bfe-master]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/deploy.sh
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          STACK_NAME: battlefront-eternal-master-production
